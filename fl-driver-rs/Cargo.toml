[package]
name = "fl-driver-rs"
version = "1.0.0"
edition = "2021"
description = "Clean, offline, privacy-first keyboard driver and configuration tool for FL-ESPORTS and Royuan keyboards"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = { version = "0.17.2", default-features = false }
